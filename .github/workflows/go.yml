name: Go

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: Build (darwin/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
            artifact: mac-drop-exec-darwin-arm64
          - goarch: amd64
            artifact: mac-drop-exec-darwin-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Test
        run: go test -v ./...

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -v -ldflags="-s -w" -o ${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Package archives
        run: |
          tar -czf mac-drop-exec-darwin-arm64.tar.gz mac-drop-exec-darwin-arm64 install.sh com.admin.daemon.plist
          tar -czf mac-drop-exec-darwin-amd64.tar.gz mac-drop-exec-darwin-amd64 install.sh com.admin.daemon.plist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mac-drop-exec-darwin-arm64.tar.gz
            mac-drop-exec-darwin-amd64.tar.gz
